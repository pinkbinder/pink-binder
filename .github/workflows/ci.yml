name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, type-check, and format check
        run: bun run validate

      - name: Audit generated publishing data
        run: bun --filter @repo/data audit:blog-publishing

      - name: Build blog
        run: bun exec turbo run build --filter=@repo/blog

      - name: Crawl every compiled blog route
        run: bun --filter @repo/blog audit:routes
