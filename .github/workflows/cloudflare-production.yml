name: Cloudflare Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  production:
    name: Cloudflare Production / ${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        # store is gated out of production until the Medusa backend is hosted
        # and the MEDUSA_* Worker secrets are set (see docs/ENV_SETUP.md).
        app: [admin, blog, landing]
    uses: 0xPlayerOne/code-foundry/.github/workflows/cloudflare-deploy.yml@v1.28.14
    with:
      mode: production
      wrangler-version: local
      working-directory: apps/${{ matrix.app }}
      # explicit package filter: the v1.28.6 auto-detect returns an empty
      # turbo_package on hosted runners, failing the impact check
      turbo-filter: '@repo/${{ matrix.app }}'
      install-working-directory: .
      build-script: build:cloudflare
      bun-version: 1.4.0
      environment: Production - pink-binder-${{ matrix.app }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # App deploys rehash hashed assets (e.g. /_astro/Layout.*.css), so any HTML
  # cached at the edge before a deploy can reference a stylesheet that no
  # longer exists and render unstyled. Purge the blog zone after production
  # deploys so cached pages always match the just-deployed asset set.
  purge-blog-zone:
    name: Cloudflare Production / purge blog zone
    needs: production
    runs-on: ubuntu-latest
    steps:
      - name: Purge pinkbinder.blog CDN cache
        env:
          CLOUDFLARE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 6ef2d55c02326c7ecfe469140f4da392
        run: |
          response=$(curl -sf -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_PURGE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -d '{"purge_everything":true}')
          echo "$response"
          echo "$response" | jq -e '.success == true' > /dev/null

  purge-landing-zone:
    name: Cloudflare Production / purge landing zone
    needs: production
    runs-on: ubuntu-latest
    steps:
      - name: Purge pinkbinder.shop CDN cache
        env:
          CLOUDFLARE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: be1ab67d01c231d4b2b681a055de2a12
        run: |
          response=$(curl -sf -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_PURGE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -d '{"purge_everything":true}')
          echo "$response"
          echo "$response" | jq -e '.success == true' > /dev/null
