name: Cloudflare Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  production:
    name: Cloudflare Production / ${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        app: [admin, blog, landing, store]
    uses: 0xPlayerOne/code-foundry/.github/workflows/cloudflare-deploy.yml@v1.22.1
    with:
      mode: production
      wrangler-version: local
      working-directory: apps/${{ matrix.app }}
      install-working-directory: .
      build-script: build:cloudflare
      bun-version: 1.4.0
      environment: Production - pink-binder-${{ matrix.app }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
