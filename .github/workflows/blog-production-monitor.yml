name: Blog production monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Public blog or preview URL to audit
        required: false
        default: https://pinkbinder.blog

permissions:
  contents: read

concurrency:
  group: blog-production-monitor
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check production routes, feeds, and static galleries
        env:
          BLOG_AUDIT_BASE_URL: ${{ inputs.base_url || 'https://pinkbinder.blog' }}
        run: node apps/blog/scripts/audit-blog-routes.mjs --base-url "$BLOG_AUDIT_BASE_URL" --max-posts 3
