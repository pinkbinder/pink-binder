name: Cloudflare Preview

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize, converted_to_draft]

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: Cloudflare Preview / ${{ matrix.app }}
    # Dependabot-triggered runs receive secrets from the Dependabot store only,
    # never from Actions (see github.com/docs "Troubleshoot Dependabot on GitHub
    # Actions"), so the deploy step fails on CLOUDFLARE_API_TOKEN even though the
    # build succeeds. Skip previews for Dependabot PRs until
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are mirrored as Dependabot
    # secrets, which restores preview deployments for them.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        # store is local-only until the Medusa backend is hosted; previews
        # would otherwise deploy a storefront with no data source.
        app: [admin, blog, landing]
    uses: 0xPlayerOne/code-foundry/.github/workflows/cloudflare-deploy.yml@v1.44.3
    with:
      mode: preview
      deploy-tool: cf
      draft-protection: true
      wrangler-version: local
      working-directory: apps/${{ matrix.app }}
      # explicit package filter: the v1.28.6 auto-detect returns an empty
      # turbo_package on hosted runners, failing the impact check
      turbo-filter: '@repo/${{ matrix.app }}'
      install-working-directory: .
      build-script: build:cloudflare
      bun-version: 1.4.0
      environment: Preview - pink-binder-${{ matrix.app }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
