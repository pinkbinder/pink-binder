name: Cloudflare Preview

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize, converted_to_draft]

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: Cloudflare Preview / ${{ matrix.app }}
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        # store is local-only until the Medusa backend is hosted; previews
        # would otherwise deploy a storefront with no data source.
        app: [admin, blog, landing]
    uses: 0xPlayerOne/code-foundry/.github/workflows/cloudflare-deploy.yml@v1.28.14
    with:
      mode: preview
      draft-protection: true
      wrangler-version: local
      working-directory: apps/${{ matrix.app }}
      # explicit package filter: the v1.28.6 auto-detect returns an empty
      # turbo_package on hosted runners, failing the impact check
      turbo-filter: '@repo/${{ matrix.app }}'
      install-working-directory: .
      build-script: build:cloudflare
      bun-version: 1.4.0
      environment: Preview - pink-binder-${{ matrix.app }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
