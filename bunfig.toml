[test]
isolate = true
preload = ["./test/preload.ts", "./test/setup.ts"]
exclude = ["dist/**", "node_modules/**", "coverage/**", "**/*.test.js"]
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
# Bun reports a non-zero exit for detailed thresholds despite passing
# aggregate coverage; the shared CI script enforces the 80% aggregate minimum.
coverageThreshold = 0
coveragePathIgnorePatterns = [
  "apps/**/app/**",
  "apps/**/components/**",
  "packages/ui/src/components/**",
  "scripts/**",
  "test/**",
  "**/*.config.*",
]
[install]
linker = "hoisted"
